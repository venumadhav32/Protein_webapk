<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Sequence Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased flex items-center justify-center min-h-screen">
    <div class="max-w-lg w-full bg-white p-8 border border-gray-200 shadow-sm rounded-none">
        <h1 class="text-3xl font-bold mb-2 tracking-tight text-black">Protein Analysis</h1>
        <p class="text-gray-500 mb-8 text-sm">Upload sequence data for cloud-based inference.</p>
        
        <form id="uploadForm" class="space-y-6">
            <div class="border-2 border-dashed border-gray-300 p-6 flex flex-col items-center justify-center hover:border-black transition-colors bg-gray-50">
                <input type="file" id="fileInput" class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:border-0 file:bg-black file:text-white hover:file:bg-gray-800 transition-colors" required>
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-black text-white font-semibold py-3 px-4 hover:bg-gray-800 transition-colors">
                Analyze Sequence
            </button>
        </form>

        <div id="result" class="hidden mt-6 p-4 bg-gray-100 border-l-4 border-black text-sm"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            const file = document.getElementById('fileInput').files[0];
            
            // Trigger asynchronous loading state
            btn.textContent = 'Processing...';
            btn.disabled = true;
            btn.classList.add('opacity-50');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await response.text();
                resultDiv.innerHTML = `<span class="font-semibold text-black">Result:</span> ${data}`;
                resultDiv.classList.remove('hidden');
            } catch (error) {
                resultDiv.innerHTML = '<span class="text-red-600 font-semibold">Error processing request.</span>';
                resultDiv.classList.remove('hidden');
            } finally {
                // Restore button state
                btn.textContent = 'Analyze Sequence';
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        });
    </script>
</body>
</html>
